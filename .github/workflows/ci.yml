name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        homeassistant: [minimum, "2026.11.2"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install test dependencies
        env:
          HOME_ASSISTANT_VERSION: ${{ matrix.homeassistant }}
        run: |
          if [[ "$HOME_ASSISTANT_VERSION" == minimum ]]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install "homeassistant==$HOME_ASSISTANT_VERSION" \
              -r <(sed '/^homeassistant==/d' requirements-dev.txt)
          fi
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=custom_components.homecall --cov-report=term-missing --cov-fail-under=90
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix card
      - run: npm run build:card && npm run format:card:check && npm run test:card
      - run: git diff --exit-code -- custom_components/homecall/frontend/homecall-card.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:recorder
      - run: npm run test:browser && npm run test:card:browser
