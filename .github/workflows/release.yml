name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check . && pytest
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix card
      - run: npm run build:card && npm run format:card:check && npm run test:card
      - run: git diff --exit-code -- custom_components/homecall/frontend/homecall-card.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:recorder && npm run test:browser && npm run test:card:browser
      - name: Verify tag and package the integration
        run: |
          python -c 'import json, os; assert os.environ["GITHUB_REF_NAME"] == "v" + json.load(open("custom_components/homecall/manifest.json"))["version"]'
          git archive --format=zip HEAD:custom_components/homecall > homecall.zip
          python scripts/check-package.py homecall.zip
      - name: Publish release with standard notes
        run: |
          previous_tag=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          validation="Ruff lint and formatting checks, integration tests, recorder tests, Chromium/WebKit browser checks, and package version checks passed in the release workflow."
          release_flags=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            release_flags=(--prerelease --latest=false)
            validation+=" See the [configuration guide](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/configuration.md#custom-announcement-volume) for verified hardware and volume limits."
          fi
          python3 scripts/release-notes.py --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --previous-tag "$previous_tag" --validation "$validation" > release-notes.md
          gh release create "$GITHUB_REF_NAME" homecall.zip --verify-tag --title "$GITHUB_REF_NAME — $(cat RELEASE_TITLE.txt)" --notes-file release-notes.md "${release_flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
