<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HomeCall · Microphone readiness</title>
  <style>
    @font-face {
      font-family: Roboto;
      font-style: normal;
      font-weight: 400;
      src: url("/output/playwright/native-fonts/Roboto-Regular.woff2")
        format("woff2");
    }
    @font-face {
      font-family: Roboto;
      font-style: normal;
      font-weight: 500;
      src: url("/output/playwright/native-fonts/Roboto-Medium.woff2")
        format("woff2");
    }
    :root {
      font:
        14px/1.5 Arial,
        sans-serif;
      color-scheme: light;
      --primary-color: #009ac7;
      --primary-text-color: #141414;
      --secondary-text-color: #5e5e5e;
      --error-color: #db4437;
      --warning-color: #ffa600;
      --ha-color-fill-primary-loud-resting: #009ac7;
      --ha-color-fill-danger-loud-resting: #dc3146;
      --divider-color: #e3e5e8;
      --ha-card-background: #fff;
      --ha-font-size-m: 14px;
      --ha-font-size-s: 12px;
      --ha-border-radius-md: 8px;
      --ha-border-radius-lg: 12px;
      --ha-card-border-radius: 12px;
      --ha-line-height-normal: 1.5;
      --ha-color-focus: #009ac0;
      background: #fafafa;
      color: var(--primary-text-color);
    }
    :root.dark {
      color-scheme: dark;
      background: #111318;
      --primary-color: #40b9d5;
      --ha-color-fill-primary-loud-resting: #40b9d5;
      --ha-color-fill-danger-loud-resting: #dc3146;
      --primary-text-color: #eceef2;
      --secondary-text-color: #a2a8b3;
      --error-color: #f17670;
      --divider-color: #373b44;
      --ha-card-background: #1d2027;
    }
    * {
      box-sizing: border-box;
    }
    body {
      max-width: 1280px;
      margin: 0 auto;
      padding: 36px 40px 48px;
    }
    h1 {
      font-size: 24px;
      line-height: 1.3;
      margin: 0 0 8px;
      font-weight: 500;
    }
    p {
      margin: 0;
      color: var(--secondary-text-color);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
    }
    .badge {
      color: var(--secondary-text-color);
      border: 1px solid var(--divider-color);
      border-radius: 20px;
      padding: 4px 12px;
      white-space: nowrap;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin: 24px 0 28px;
    }
    button,
    select {
      font: inherit;
      padding: 8px 12px;
      border: 1px solid var(--divider-color);
      border-radius: 8px;
      color: var(--primary-text-color);
      background: var(--ha-card-background);
      cursor: pointer;
    }
    button[aria-pressed="true"] {
      color: var(--primary-color);
      border-color: var(--primary-color);
    }
    button:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 3px;
    }
    label {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }
    .spacer {
      flex: 1;
    }
    .row-title {
      font-size: 14px;
      font-weight: 500;
      margin: 24px 0 12px;
    }
    .row-title span {
      color: var(--secondary-text-color);
      font-weight: 400;
      margin-left: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      align-items: start;
    }
    .grid.all {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .case {
      min-width: 0;
    }
    .phase {
      font-size: 12px;
      color: var(--secondary-text-color);
      margin: 0 0 8px;
    }
    homecall-card {
      display: block;
    }
    footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--divider-color);
      font-size: 12px;
      color: var(--secondary-text-color);
    }
    @media (max-width: 1100px) {
      body {
        padding: 24px;
      }
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid.all {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 650px) {
      header {
        align-items: start;
      }
      .grid,
      .grid.all {
        grid-template-columns: 1fr;
      }
      body {
        padding: 20px;
      }
    }
  </style>
  <header>
    <div>
      <h1>Microphone readiness</h1>
      <p>One control. Clear feedback at every card size.</p>
    </div>
    <span class="badge">Local preview</span>
  </header>
  <nav aria-label="Preview options">
    <button id="readiness" aria-pressed="true">Readiness</button
    ><button id="states" aria-pressed="false">All states</button
    ><button id="sizing" aria-pressed="false">Sizing check</button>
    <label><input id="picker" type="checkbox" /> Speaker picker</label>
    <label
      >Language
      <select id="language">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select></label
    >
    <span class="spacer"></span
    ><button id="theme" aria-pressed="false">Dark theme</button>
  </nav>
  <main id="gallery"></main>
  <footer>
    Rendered from the local HomeCall build with lightweight Home Assistant
    control fixtures. No microphone access, uploads, or speaker playback.
  </footer>
  <script type="module" src="./readiness-preview.js"></script>
</html>
